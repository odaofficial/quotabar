name: Build
on:
  push:
  pull_request:
jobs:
  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Test release privacy checks
        run: python3 Scripts/test-release-privacy.py
      - name: Package
        run: ./Scripts/package.sh
